<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <style>
        :root {
            --primary-color: #2196F3;
            --bg-color: #1e1e1e;
            --surface-color: #2d2d2d;
            --text-color: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #404040;
            --hover-color: #383838;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-color);
            padding: 0;
            margin: 0;
            color: var(--text-color);
        }

        .container {
            max-width: 100%;
            margin: 0;
            background: var(--bg-color);
            min-height: 100vh;
        }

        .tabs {
            display: flex;
            background: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.3s;
        }

        .tab.active {
            background: var(--bg-color);
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        .tab:hover {
            background: var(--hover-color);
        }

        .content {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .add-form {
            background: var(--surface-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-success {
            background: #4CAF50;
        }

        .btn-danger {
            background: #f44336;
        }

        .btn-secondary {
            background: #666;
        }

        .category-section {
            margin-bottom: 25px;
        }

        .category-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            padding: 12px 0;
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-emoji {
            font-size: 24px;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 14px;
            background: var(--surface-color);
            border-radius: 6px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .item:hover {
            background: var(--hover-color);
        }

        .item.in-cart {
            opacity: 0.6;
        }

        .item.in-cart .item-name {
            text-decoration: line-through;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            margin-right: 14px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-color);
        }

        .item-quantity {
            font-size: 14px;
            color: var(--text-secondary);
            margin-left: 8px;
        }

        .delete-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .cart-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            margin-top: 15px;
        }

        .recipe-list {
            display: grid;
            gap: 15px;
        }

        .recipe-card {
            background: var(--surface-color);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .recipe-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
        }

        .recipe-actions {
            display: flex;
            gap: 8px;
        }

        .recipe-ingredients {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--surface-color);
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text-color);
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .ingredient-item, .category-item {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
        }

        .ingredient-item input, .category-item input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .ingredient-item .ing-name {
            flex: 2;
            min-width: 150px;
        }

        .ingredient-item .ing-qty {
            flex: 0 0 80px;
        }

        .ingredient-item .ing-cat {
            flex: 1;
            min-width: 120px;
        }

        .category-item input {
            flex: 1;
        }

        .remove-ingredient, .remove-category {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .add-ingredient, .add-category {
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
            font-size: 16px;
        }

        .settings-grid {
            display: grid;
            gap: 20px;
        }

        .settings-section {
            background: var(--surface-color);
            padding: 20px;
            border-radius: 8px;
        }

        .settings-section h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .color-input {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-input input[type="color"] {
            width: 60px;
            height: 40px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .theme-presets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .theme-preset {
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .theme-preset:hover {
            transform: translateY(-2px);
        }

        .theme-preset.active {
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('shopping')">🛒 Shopping List</button>
            <button class="tab" onclick="switchTab('recipes')">🍳 Recipes</button>
            <button class="tab" onclick="switchTab('settings')">⚙️ Settings</button>
        </div>

        <div class="content">
            <!-- Shopping List Tab -->
            <div id="shopping-tab" class="tab-content active">
                <div class="add-form">
                    <h3 style="margin-bottom: 15px;">Add Item</h3>
                    <div class="form-group">
                        <label>Item Name</label>
                        <input type="text" id="item-name" placeholder="e.g., Milk">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="item-category"></select>
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="text" id="item-quantity" placeholder="e.g., 2" value="1">
                    </div>
                    <button class="btn" onclick="addItem()">Add Item</button>
                </div>

                <div id="items-container"></div>

                <div class="cart-section">
                    <div class="category-title">
                        <span class="category-emoji">🛒</span>
                        <span>In Cart</span>
                    </div>
                    <div id="cart-container"></div>
                    <button class="btn btn-danger checkout-btn" onclick="checkout()">Checkout</button>
                </div>
            </div>

            <!-- Recipes Tab -->
            <div id="recipes-tab" class="tab-content">
                <button class="btn btn-success" onclick="openRecipeModal()" style="margin-bottom: 20px;">Create Recipe</button>
                <div id="recipes-container" class="recipe-list"></div>
            </div>

            <!-- Settings Tab -->
            <div id="settings-tab" class="tab-content">
                <div class="settings-grid">
                    <div class="settings-section">
                        <h3>Theme Presets</h3>
                        <div class="theme-presets">
                            <div class="theme-preset" style="background: #1e1e1e; color: #e0e0e0;" onclick="applyPreset('dark')">Dark</div>
                            <div class="theme-preset" style="background: #f5f5f5; color: #333;" onclick="applyPreset('light')">Light</div>
                            <div class="theme-preset" style="background: #0d1117; color: #c9d1d9;" onclick="applyPreset('github')">GitHub</div>
                            <div class="theme-preset" style="background: #1a1a2e; color: #eee;" onclick="applyPreset('midnight')">Midnight</div>
                            <div class="theme-preset" style="background: #2d1b2e; color: #e8c4f0;" onclick="applyPreset('purple')">Purple</div>
                            <div class="theme-preset" style="background: #1a0d1f; color: #d4a5d9;" onclick="applyPreset('darkpurple')">Dark Purple</div>
                            <div class="theme-preset" style="background: #2d1f2e; color: #ffc0e0;" onclick="applyPreset('pink')">Pink</div>
                            <div class="theme-preset" style="background: #1f2e2d; color: #a0e0d8;" onclick="applyPreset('teal')">Teal</div>
                            <div class="theme-preset" style="background: #2e1f1a; color: #f0c4a0;" onclick="applyPreset('brown')">Brown</div>
                            <div class="theme-preset" style="background: #1a2e1f; color: #b0e0b0;" onclick="applyPreset('forest')">Forest</div>
                        </div>
                    </div>
                    
                    <div class="settings-section">
                        <h3>Custom Colors</h3>
                        <div class="form-group">
                            <label>Primary Color</label>
                            <div class="color-input">
                                <input type="color" id="primary-color" onchange="updateTheme()">
                                <input type="text" id="primary-color-text" readonly style="flex: 1;">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Background Color</label>
                            <div class="color-input">
                                <input type="color" id="bg-color" onchange="updateTheme()">
                                <input type="text" id="bg-color-text" readonly style="flex: 1;">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Surface Color</label>
                            <div class="color-input">
                                <input type="color" id="surface-color" onchange="updateTheme()">
                                <input type="text" id="surface-color-text" readonly style="flex: 1;">
                            </div>
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3>Manage Categories</h3>
                        <div id="categories-list"></div>
                        <button class="btn add-category" onclick="addCategoryField()">Add Category</button>
                        <button class="btn btn-success" onclick="saveCategories()" style="margin-top: 15px;">Save Categories</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Recipe Modal -->
    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Create Recipe</div>
            <div class="form-group">
                <label>Recipe Name</label>
                <input type="text" id="recipe-name" placeholder="e.g., Pasta Carbonara">
            </div>
            <div class="form-group">
                <label>Ingredients</label>
                <div id="ingredients-list"></div>
                <button class="btn add-ingredient" onclick="addIngredientField()">Add Ingredient</button>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeRecipeModal()">Cancel</button>
                <button class="btn btn-success" onclick="saveRecipe()">Save Recipe</button>
            </div>
        </div>
    </div>

    <script>
        let ingredientCount = 0;
        let categoryCount = 0;
        let categories = [];
        let currentTheme = {};

        const THEME_PRESETS = {
            dark: {
                mode: 'dark',
                primary: '#2196F3',
                background: '#1e1e1e',
                surface: '#2d2d2d'
            },
            light: {
                mode: 'light',
                primary: '#1976D2',
                background: '#f5f5f5',
                surface: '#ffffff'
            },
            github: {
                mode: 'dark',
                primary: '#58a6ff',
                background: '#0d1117',
                surface: '#161b22'
            },
            midnight: {
                mode: 'dark',
                primary: '#00adb5',
                background: '#1a1a2e',
                surface: '#16213e'
            },
            purple: {
                mode: 'dark',
                primary: '#b794f6',
                background: '#2d1b2e',
                surface: '#3d2b3e'
            },
            darkpurple: {
                mode: 'dark',
                primary: '#a855f7',
                background: '#1a0d1f',
                surface: '#2a1d2f'
            },
            pink: {
                mode: 'dark',
                primary: '#ff69b4',
                background: '#2d1f2e',
                surface: '#3d2f3e'
            },
            teal: {
                mode: 'dark',
                primary: '#14b8a6',
                background: '#1f2e2d',
                surface: '#2f3e3d'
            },
            brown: {
                mode: 'dark',
                primary: '#d4956c',
                background: '#2e1f1a',
                surface: '#3e2f2a'
            },
            forest: {
                mode: 'dark',
                primary: '#4ade80',
                background: '#1a2e1f',
                surface: '#2a3e2f'
            }
        };

        async function loadTheme() {
            const response = await fetch('/api/theme');
            currentTheme = await response.json();
            applyThemeColors(currentTheme);
        }

        function applyThemeColors(theme) {
            document.documentElement.style.setProperty('--primary-color', theme.primary);
            document.documentElement.style.setProperty('--bg-color', theme.background);
            document.documentElement.style.setProperty('--surface-color', theme.surface);
            
            // Auto-calculate text colors based on background
            const isDark = theme.mode === 'dark';
            document.documentElement.style.setProperty('--text-color', isDark ? '#e0e0e0' : '#333333');
            document.documentElement.style.setProperty('--text-secondary', isDark ? '#b0b0b0' : '#666666');
            document.documentElement.style.setProperty('--border-color', isDark ? '#404040' : '#dddddd');
            document.documentElement.style.setProperty('--hover-color', isDark ? '#383838' : '#eeeeee');

            // Update color inputs
            document.getElementById('primary-color').value = theme.primary;
            document.getElementById('primary-color-text').value = theme.primary;
            document.getElementById('bg-color').value = theme.background;
            document.getElementById('bg-color-text').value = theme.background;
            document.getElementById('surface-color').value = theme.surface;
            document.getElementById('surface-color-text').value = theme.surface;
        }

        async function applyPreset(preset) {
            currentTheme = THEME_PRESETS[preset];
            applyThemeColors(currentTheme);
            await fetch('/api/theme', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(currentTheme)
            });
        }

        async function updateTheme() {
            const theme = {
                mode: 'custom',
                primary: document.getElementById('primary-color').value,
                background: document.getElementById('bg-color').value,
                surface: document.getElementById('surface-color').value
            };
            
            document.getElementById('primary-color-text').value = theme.primary;
            document.getElementById('bg-color-text').value = theme.background;
            document.getElementById('surface-color-text').value = theme.surface;
            
            applyThemeColors(theme);
            await fetch('/api/theme', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(theme)
            });
        }

        async function loadCategories() {
            const response = await fetch('/api/categories');
            categories = await response.json();
            updateCategoryDropdown();
            updateCategoriesManager();
        }

        function updateCategoryDropdown() {
            const select = document.getElementById('item-category');
            select.innerHTML = categories.map(cat => 
                `<option value="${cat.name}">${cat.emoji} ${cat.name}</option>`
            ).join('');
        }

        function updateCategoriesManager() {
            const container = document.getElementById('categories-list');
            container.innerHTML = categories.map((cat, idx) => `
                <div class="category-item" data-index="${idx}">
                    <input type="text" value="${cat.emoji}" placeholder="Emoji" maxlength="2" style="max-width: 60px;">
                    <input type="text" value="${cat.name}" placeholder="Category Name">
                    <button class="remove-category" onclick="removeCategory(${idx})">×</button>
                </div>
            `).join('');
        }

        function addCategoryField() {
            categories.push({name: 'New Category', emoji: '📦'});
            updateCategoriesManager();
        }

        function removeCategory(idx) {
            categories.splice(idx, 1);
            updateCategoriesManager();
        }

        async function saveCategories() {
            const items = document.querySelectorAll('.category-item');
            categories = Array.from(items).map(item => ({
                emoji: item.querySelectorAll('input')[0].value,
                name: item.querySelectorAll('input')[1].value
            }));
            
            await fetch('/api/categories', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({categories})
            });
            
            updateCategoryDropdown();
            alert('Categories saved!');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            if (tab === 'shopping') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('shopping-tab').classList.add('active');
                loadItems();
            } else if (tab === 'recipes') {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('recipes-tab').classList.add('active');
                loadRecipes();
            } else if (tab === 'settings') {
                document.querySelectorAll('.tab')[2].classList.add('active');
                document.getElementById('settings-tab').classList.add('active');
            }
        }

        async function loadItems() {
            const response = await fetch('/api/items');
            const data = await response.json();
            
            const itemsContainer = document.getElementById('items-container');
            const cartContainer = document.getElementById('cart-container');
            
            itemsContainer.innerHTML = '';
            cartContainer.innerHTML = '';
            
            // Render active items by category
            if (Object.keys(data.active).length === 0) {
                itemsContainer.innerHTML = '<div class="empty-state">No items yet. Add your first item!</div>';
            } else {
                for (const [categoryName, items] of Object.entries(data.active)) {
                    const category = categories.find(c => c.name === categoryName) || {name: categoryName, emoji: '📦'};
                    const section = document.createElement('div');
                    section.className = 'category-section';
                    section.innerHTML = `
                        <div class="category-title">
                            <span class="category-emoji">${category.emoji}</span>
                            <span>${category.name}</span>
                        </div>
                    `;
                    
                    items.forEach(item => {
                        section.innerHTML += renderItem(item);
                    });
                    
                    itemsContainer.appendChild(section);
                }
            }
            
            // Render cart items
            if (data.cart.length === 0) {
                cartContainer.innerHTML = '<div class="empty-state">Cart is empty</div>';
            } else {
                data.cart.forEach(item => {
                    cartContainer.innerHTML += renderItem(item);
                });
            }
        }

        function renderItem(item) {
            return `
                <div class="item ${item.in_cart ? 'in-cart' : ''}">
                    <input type="checkbox" class="checkbox" ${item.in_cart ? 'checked' : ''} 
                           onchange="toggleItem('${item.id}')">
                    <div class="item-details">
                        <span class="item-name">${item.name}</span>
                        <span class="item-quantity">(${item.quantity})</span>
                    </div>
                    <button class="delete-btn" onclick="deleteItem('${item.id}')">Delete</button>
                </div>
            `;
        }

        async function addItem() {
            const name = document.getElementById('item-name').value;
            const category = document.getElementById('item-category').value;
            const quantity = document.getElementById('item-quantity').value;
            
            if (!name) {
                alert('Please enter an item name');
                return;
            }
            
            await fetch('/api/items', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, category, quantity})
            });
            
            document.getElementById('item-name').value = '';
            document.getElementById('item-quantity').value = '1';
            
            loadItems();
        }

        async function toggleItem(id) {
            await fetch(`/api/items/${id}/toggle`, {method: 'POST'});
            loadItems();
        }

        async function deleteItem(id) {
            if (!confirm('Delete this item?')) return;
            await fetch(`/api/items/${id}`, {method: 'DELETE'});
            loadItems();
        }

        async function checkout() {
            if (!confirm('Remove all items from cart?')) return;
            await fetch('/api/checkout', {method: 'POST'});
            loadItems();
        }

        async function loadRecipes() {
            const response = await fetch('/api/recipes');
            const recipes = await response.json();
            
            const container = document.getElementById('recipes-container');
            
            if (recipes.length === 0) {
                container.innerHTML = '<div class="empty-state">No recipes yet. Create your first recipe!</div>';
                return;
            }
            
            container.innerHTML = recipes.map(recipe => `
                <div class="recipe-card">
                    <div class="recipe-header">
                        <div class="recipe-name">${recipe.name}</div>
                        <div class="recipe-actions">
                            <button class="btn btn-success" onclick="addRecipeToList('${recipe.id}')">Add to List</button>
                            <button class="delete-btn" onclick="deleteRecipe('${recipe.id}')">Delete</button>
                        </div>
                    </div>
                    <div class="recipe-ingredients">
                        ${recipe.ingredients.map(i => {
                            const cat = categories.find(c => c.name === i.category) || {emoji: '📦'};
                            return `${cat.emoji} ${i.name} (${i.quantity})`;
                        }).join('<br>')}
                    </div>
                </div>
            `).join('');
        }

        function openRecipeModal() {
            document.getElementById('recipe-modal').classList.add('active');
            document.getElementById('recipe-name').value = '';
            document.getElementById('ingredients-list').innerHTML = '';
            ingredientCount = 0;
            addIngredientField();
        }

        function closeRecipeModal() {
            document.getElementById('recipe-modal').classList.remove('active');
        }

        function addIngredientField() {
            const id = ingredientCount++;
            const html = `
                <div class="ingredient-item" id="ingredient-${id}">
                    <input type="text" placeholder="Name" class="ing-name">
                    <input type="text" placeholder="Qty" class="ing-qty" value="1">
                    <select class="ing-cat">${categories.map(c => `<option value="${c.name}">${c.emoji} ${c.name}</option>`).join('')}</select>
                    <button class="remove-ingredient" onclick="removeIngredient(${id})">×</button>
                </div>
            `;
            document.getElementById('ingredients-list').insertAdjacentHTML('beforeend', html);
        }

        function removeIngredient(id) {
            document.getElementById(`ingredient-${id}`).remove();
        }

        async function saveRecipe() {
            const name = document.getElementById('recipe-name').value;
            if (!name) {
                alert('Please enter a recipe name');
                return;
            }
            
            const ingredients = [];
            document.querySelectorAll('.ingredient-item').forEach(item => {
                const ingName = item.querySelector('.ing-name').value;
                const ingQty = item.querySelector('.ing-qty').value;
                const ingCat = item.querySelector('.ing-cat').value;
                
                if (ingName) {
                    ingredients.push({
                        name: ingName,
                        quantity: ingQty,
                        category: ingCat
                    });
                }
            });
            
            if (ingredients.length === 0) {
                alert('Please add at least one ingredient');
                return;
            }
            
            await fetch('/api/recipes', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, ingredients})
            });
            
            closeRecipeModal();
            loadRecipes();
        }

        async function addRecipeToList(id) {
            await fetch(`/api/recipes/${id}/add`, {method: 'POST'});
            alert('Recipe ingredients added to shopping list!');
            switchTab('shopping');
        }

        async function deleteRecipe(id) {
            if (!confirm('Delete this recipe?')) return;
            await fetch(`/api/recipes/${id}`, {method: 'DELETE'});
            loadRecipes();
        }

        // Initialize
        (async function() {
            await loadTheme();
            await loadCategories();
            loadItems();
        })();
    </script>
</body>
</html>
